        <rect y="44" width="380" height="104" rx="14" fill="#eefaf8" stroke="#c4ece6"/><text x="20" y="80" font-size="21" font-weight="700" fill="#0f2a5c">VRF maintenance visit</text><text x="20" y="112" font-size="18" fill="#51607a">Checklist 6 of 9 done</text>
        <rect y="164" width="380" height="104" rx="14" fill="#eefaf8" stroke="#c4ece6"/><text x="20" y="200" font-size="21" font-weight="700" fill="#0f2a5c">Camera installation</text><text x="20" y="232" font-size="18" fill="#51607a">Photos uploaded</text>
        <rect y="284" width="380" height="104" rx="14" fill="#eefaf8" stroke="#c4ece6"/><text x="20" y="320" font-size="21" font-weight="700" fill="#0f2a5c">Site equipment check</text><text x="20" y="352" font-size="18" fill="#51607a">Parts used recorded</text>
