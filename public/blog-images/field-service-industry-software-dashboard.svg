        <rect y="164" width="380" height="104" rx="14" fill="#f3f7ff" stroke="#d6e2fb"/><text x="20" y="200" font-size="21" font-weight="700" fill="#0f2a5c">CCTV site survey</text><text x="20" y="232" font-size="18" fill="#51607a">Technician B · 12:00</text>
        <rect y="284" width="380" height="104" rx="14" fill="#f3f7ff" stroke="#d6e2fb"/><text x="20" y="320" font-size="21" font-weight="700" fill="#0f2a5c">Solar inverter service</text><text x="20" y="352" font-size="18" fill="#51607a">Technician C · 15:00</text>
      </g>
      <g transform="translate(410 0)">
