        <rect y="44" width="390" height="104" rx="14" fill="#f5f1ff" stroke="#e0d6fb"/><text x="20" y="80" font-size="21" font-weight="700" fill="#0f2a5c">Split AC servicing</text><text x="20" y="112" font-size="18" fill="#51607a">Customer sign-off received</text>
        <rect y="164" width="390" height="104" rx="14" fill="#f5f1ff" stroke="#e0d6fb"/><text x="20" y="200" font-size="21" font-weight="700" fill="#0f2a5c">DVR repair</text><text x="20" y="232" font-size="18" fill="#51607a">Invoice ready</text>
        <rect y="284" width="390" height="104" rx="14" fill="#fff6ec" stroke="#f6dfbd"/><text x="20" y="320" font-size="21" font-weight="700" fill="#0f2a5c">AMC renewal due in 15 days</text><text x="20" y="352" font-size="18" fill="#51607a">Reminder scheduled</text>
