      <rect x="620" width="280" height="110" rx="16" fill="#fff6ec"/><text x="642" y="40" font-size="20" fill="#51607a">AMC renewals due</text><text x="642" y="86" font-size="42" font-weight="700" fill="#0f2a5c">7</text>
      <rect x="930" width="280" height="110" rx="16" fill="#f5f1ff"/><text x="952" y="40" font-size="20" fill="#51607a">Completed today</text><text x="952" y="86" font-size="42" font-weight="700" fill="#0f2a5c">18</text>
