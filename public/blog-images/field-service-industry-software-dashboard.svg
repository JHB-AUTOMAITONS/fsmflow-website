<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Field service management dashboard illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef4ff"/><stop offset="1" stop-color="#e3f6f8"/></linearGradient>
    <linearGradient id="hd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb"/><stop offset="1" stop-color="#0ea5b7"/></linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0f2a5c" flood-opacity=".16"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g filter="url(#sh)">
    <rect x="170" y="90" width="1260" height="720" rx="28" fill="#fff"/>
    <path d="M170 118a28 28 0 0 1 28-28h1204a28 28 0 0 1 28 28v52H170z" fill="url(#hd)"/>
    <circle cx="214" cy="130" r="9" fill="#fff" opacity=".85"/><circle cx="244" cy="130" r="9" fill="#fff" opacity=".6"/><circle cx="274" cy="130" r="9" fill="#fff" opacity=".4"/>
    <text x="330" y="138" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff">Service operations</text>
  </g>
